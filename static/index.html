<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Coolout</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; background: #111; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #ffcc00; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }

        /* Экран ввода кода */
        .input-screen { display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto; }
        input { padding: 15px; border-radius: 10px; border: 2px solid #333; background: #222; color: #fff; font-size: 20px; text-align: center; text-transform: uppercase; font-weight: bold; }
        input:focus { outline: none; border-color: #ffcc00; }
        button { padding: 15px; border-radius: 10px; border: none; background: #ffcc00; color: #000; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Экран колеса */
        .wheel-screen { display: none; flex-direction: column; align-items: center; margin-top: 20px; }
        .wheel-container { position: relative; width: 280px; height: 280px; margin-bottom: 30px; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #333; position: relative; transition: transform 4s cubic-bezier(0.25, 0.1, 0.15, 1); }
        .wheel-inner { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#ffcc00 0deg 60deg, #222 60deg 120deg, #ffcc00 120deg 180deg, #222 180deg 240deg, #ffcc00 240deg 300deg, #222 300deg 360deg); }
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: #fff; border-radius: 50%; border: 4px solid #333; z-index: 2; display: flex; justify-content: center; align-items: center; font-size: 24px;}
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ff4d4d; z-index: 3; }

        /* Результат */
        .result-screen { display: none; margin-top: 20px; padding: 20px; background: #222; border-radius: 15px; border: 1px solid #ffcc00; }
        .promo-code { font-size: 24px; font-weight: bold; color: #ffcc00; letter-spacing: 2px; margin: 10px 0; padding: 10px; background: #111; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- Экран 1: Ввод кода -->
    <div id="screen-input" class="input-screen">
        <h1>Крути и побеждай!</h1>
        <p>Введи код с чека, чтобы крутить колесо</p>
        <input type="text" id="receipt-code" placeholder="0000" maxlength="4">
        <button id="btn-check">Проверить код</button>
        <p id="error-msg" style="color: #ff4d4d; font-size: 14px; min-height: 20px;"></p>
    </div>

    <!-- Экран 2: Колесо -->
    <div id="screen-wheel" class="wheel-screen">
        <h1>Твой шанс!</h1>
        <p>Нажми на кнопку ниже</p>
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-inner"></div>
                <div class="wheel-center">🎁</div>
            </div>
        </div>
        <button id="btn-spin">Крутить!</button>
    </div>

    <!-- Экран 3: Результат -->
    <div id="screen-result" class="result-screen">
        <h1>Поздравляем!</h1>
        <p>Ты выиграл:</p>
        <h2 id="prize-text" style="color: #fff; margin: 10px 0;"></h2>
        <p style="margin-bottom: 5px;">Покажи этот промокод на кассе:</p>
        <div class="promo-code" id="promo-code">COOL-XXX</div>
        <button onclick="tg.close()" style="margin-top: 20px; width: 100%;">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        const initData = tg.initData;

        const screenInput = document.getElementById('screen-input');
        const screenWheel = document.getElementById('screen-wheel');
        const screenResult = document.getElementById('screen-result');

        const btnCheck = document.getElementById('btn-check');
        const inputCode = document.getElementById('receipt-code');
        const errorMsg = document.getElementById('error-msg');
        const wheel = document.getElementById('wheel');
        const btnSpin = document.getElementById('btn-spin');

        // Проверка кода
        btnCheck.addEventListener('click', async () => {
            const code = inputCode.value.trim();
            if (code.length !== 4) {
                errorMsg.textContent = "Код должен состоять из 4 цифр";
                return;
            }
            btnCheck.disabled = true;
            btnCheck.textContent = "Проверяем...";

            try {
                const res = await fetch('/api/check_receipt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code, initData: initData})
                });
                const data = await res.json();
                if (res.ok) {
                    screenInput.style.display = 'none';
                    screenWheel.style.display = 'flex';
                } else {
                    throw new Error(data.error);
                }
            } catch (e) {
                errorMsg.textContent = e.message;
                btnCheck.disabled = false;
                btnCheck.textContent = "Проверить код";
            }
        });

        // Кручение колеса
        btnSpin.addEventListener('click', async () => {
            btnSpin.disabled = true;
            btnSpin.textContent = "Крутим...";

            // Анимация (крутим 5 полных оборотов + случайный угол)
            const randomDeg = Math.floor(Math.random() * 360);
            const totalDeg = 1800 + randomDeg; 
            wheel.style.transform = `rotate(${totalDeg}deg)`;

            // Ждем окончания анимации (4 секунды)
            setTimeout(async () => {
                try {
                    const res = await fetch('/api/spin', { method: 'POST' });
                    const data = await res.json();

                    document.getElementById('prize-text').textContent = data.prize;
                    document.getElementById('promo-code').textContent = data.promo_code;

                    screenWheel.style.display = 'none';
                    screenResult.style.display = 'block';
                } catch (e) {
                    alert("Ошибка при получении приза");
                }
            }, 4000);
        });
    </script>
</body>
</html>
